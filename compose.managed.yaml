services:
  panel:
    depends_on:
      port-agent:
        condition: service_healthy
    environment:
      PANEL_UDP_PROBE_TOKEN: ${PANEL_UDP_PROBE_TOKEN:-}
      PANEL_UDP_PROBE_ID: ${PANEL_UDP_PROBE_ID:-}
    volumes:
      - port-agent-socket:/run/hy2-port-agent:ro
  port-agent:
    image: ${PANEL_IMAGE:?Managed image required}
    user: "0:0"
    entrypoint: ["/usr/local/bin/port-agent"]
    restart: unless-stopped
    network_mode: host
    environment:
      HY2_INSTALL_DIR: ${PANEL_INSTALL_DIR:?Installation directory required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PANEL_INSTALL_DIR}:${PANEL_INSTALL_DIR}
      - port-agent-socket:/run/hy2-port-agent
    healthcheck:
      test: ["CMD", "/usr/local/bin/port-agent", "health"]
      interval: 2s
      timeout: 4s
      retries: 15
volumes:
  port-agent-socket:
